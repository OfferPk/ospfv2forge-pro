  <rect x="510" y="575" width="640" height="185" rx="6" fill="#02050f" stroke="#16264d" />
  <text x="525" y="598" fill="#10b981" font-family="monospace" font-size="11">! Cisco IOS-XE Hardened OSPFv2 Configuration (RFC 2328 &amp; RFC 5709)</text>
  <text x="525" y="618" fill="#cbd5e1" font-family="monospace" font-size="11">router ospf 1 &amp; router-id 10.254.0.1</text>
  <text x="525" y="638" fill="#c084fc" font-family="monospace" font-size="11"> auto-cost reference-bandwidth 100000  ! Eliminates 1G/10G/100G saturation</text>
  <text x="525" y="658" fill="#fbbf24" font-family="monospace" font-size="11"> passive-interface default &amp; no passive-interface Gi0/0/1</text>
  <text x="525" y="678" fill="#38bdf8" font-family="monospace" font-size="11">interface Gi0/0/1 &amp; ip ospf authentication mode hmac-sha-256 &amp; bfd</text>
  <text x="525" y="698" fill="#34d399" font-family="monospace" font-size="11">alert: OSPFExStartDeadlock &amp; expr: cisco_ospf_neighbor_state == 6 &amp; for: 45s</text>
